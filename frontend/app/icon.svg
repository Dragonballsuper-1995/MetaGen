<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glass Rim Stroke -->
    <linearGradient id="appRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Left Wing M Gradient -->
    <linearGradient id="appLeftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Wing M Gradient -->
    <linearGradient id="appRightWingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Core Quantum Play Prism Gradient -->
    <linearGradient id="appPlayPrismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Ambient Core Glow Filter -->
    <filter id="appCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="appSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#appBgGrad)" stroke="url(#appRimGrad)" stroke-width="8"/>

  <!-- Ambient Light Reflection Behind Logo -->
  <circle cx="256" cy="256" r="140" fill="#2563EB" opacity="0.15" filter="url(#appCoreGlow)"/>

  <!-- Left Facet Wing of M -->
  <path d="M 112 368 L 112 172 L 200 256 L 200 368 Z" fill="url(#appLeftWingGrad)"/>

  <!-- Right Facet Wing of M -->
  <path d="M 400 368 L 400 172 L 312 256 L 312 368 Z" fill="url(#appRightWingGrad)"/>

  <!-- Central Quantum Play Prism (▶) -->
  <path d="M 200 172 L 344 256 L 200 340 Z" fill="url(#appPlayPrismGrad)" filter="url(#appSoftGlow)"/>

  <!-- Prismatic Refraction Highlights -->
  <path d="M 112 172 L 256 108 L 400 172" stroke="#67E8F9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M 256 108 L 256 256" stroke="#A5F3FC" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Apex Quantum Spark Node -->
  <circle cx="256" cy="108" r="16" fill="#FFFFFF" filter="url(#appCoreGlow)"/>
  <circle cx="256" cy="108" r="8" fill="#38BDF8"/>
</svg>
