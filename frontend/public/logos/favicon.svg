<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Embedded Styles for Standalone Rendering */
    .logo-active { fill: #000000; }
    .logo-dim { fill: #E0E0E0; }
    .accent-blue { fill: #0084FF; }
    
    /* Native Dark Mode Auto-Switching */
    @media (prefers-color-scheme: dark) {
      .logo-active { fill: #FFFFFF; }
      .logo-dim { fill: #222222; }
    }
  </style>

  <!-- Optional Background Glow -->
  <circle cx="50" cy="50" r="35" class="accent-blue" opacity="0.15" filter="blur(18px)"/>
  
  <!-- Inactive Background Matrix -->
  <g class="logo-dim">
    <circle cx="20" cy="20" r="1.5"/><circle cx="35" cy="20" r="1.5"/><circle cx="50" cy="20" r="1.5"/><circle cx="65" cy="20" r="1.5"/><circle cx="80" cy="20" r="1.5"/>
    <circle cx="20" cy="35" r="1.5"/><circle cx="35" cy="35" r="1.5"/><circle cx="50" cy="35" r="1.5"/><circle cx="65" cy="35" r="1.5"/><circle cx="80" cy="35" r="1.5"/>
    <circle cx="20" cy="50" r="1.5"/><circle cx="35" cy="50" r="1.5"/><circle cx="50" cy="50" r="1.5"/><circle cx="65" cy="50" r="1.5"/><circle cx="80" cy="50" r="1.5"/>
    <circle cx="20" cy="65" r="1.5"/><circle cx="35" cy="65" r="1.5"/><circle cx="50" cy="65" r="1.5"/><circle cx="65" cy="65" r="1.5"/><circle cx="80" cy="65" r="1.5"/>
    <circle cx="20" cy="80" r="1.5"/><circle cx="35" cy="80" r="1.5"/><circle cx="50" cy="80" r="1.5"/><circle cx="65" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/>
  </g>

  <!-- Active 'M' Nodes -->
  <g class="logo-active">
    <circle cx="20" cy="20" r="6"/><circle cx="20" cy="35" r="6"/><circle cx="20" cy="50" r="6"/><circle cx="20" cy="65" r="6"/><circle cx="20" cy="80" r="6"/>
    <circle cx="35" cy="35" r="6"/><circle cx="65" cy="35" r="6"/>
    <circle cx="80" cy="20" r="6"/><circle cx="80" cy="35" r="6"/><circle cx="80" cy="50" r="6"/><circle cx="80" cy="65" r="6"/><circle cx="80" cy="80" r="6"/>
  </g>
  
  <!-- Central LPU Node -->
  <circle cx="50" cy="50" r="6" class="accent-blue"/>
</svg>
