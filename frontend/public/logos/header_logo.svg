      </g>
      <!-- N -->
      <g transform="translate(444, 0)">
        <circle cx="0" cy="0" r="2.5"/><circle cx="0" cy="12" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="0" cy="36" r="2.5"/><circle cx="0" cy="48" r="2.5"/>
        <circle cx="12" cy="12" r="2.5"/>
        <circle cx="24" cy="24" r="2.5"/>
        <circle cx="36" cy="36" r="2.5"/>
        <circle cx="48" cy="0" r="2.5"/><circle cx="48" cy="12" r="2.5"/><circle cx="48" cy="24" r="2.5"/><circle cx="48" cy="36" r="2.5"/><circle cx="48" cy="48" r="2.5"/>
