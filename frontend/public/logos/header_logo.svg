        <circle cx="0" cy="36" r="2.5"/><circle cx="48" cy="36" r="2.5"/>
        <circle cx="12" cy="48" r="2.5"/><circle cx="24" cy="48" r="2.5"/><circle cx="36" cy="48" r="2.5"/><circle cx="48" cy="48" r="2.5"/>
      </g>
      <!-- E -->
      <g transform="translate(372, 0)">
        <circle cx="0" cy="0" r="2.5"/><circle cx="0" cy="12" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="0" cy="36" r="2.5"/><circle cx="0" cy="48" r="2.5"/>
        <circle cx="12" cy="0" r="2.5"/><circle cx="24" cy="0" r="2.5"/><circle cx="36" cy="0" r="2.5"/><circle cx="48" cy="0" r="2.5"/>
        <circle cx="12" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="36" cy="24" r="2.5"/>
