      <g transform="translate(216, 0)">
        <circle cx="12" cy="0" r="4.5"/><circle cx="24" cy="0" r="4.5"/><circle cx="36" cy="0" r="4.5"/>
        <circle cx="0" cy="12" r="4.5"/><circle cx="48" cy="12" r="4.5"/>
        <circle cx="0" cy="24" r="4.5"/><circle cx="12" cy="24" r="4.5"/><circle cx="24" cy="24" r="4.5"/><circle cx="36" cy="24" r="4.5"/><circle cx="48" cy="24" r="4.5"/>
        <circle cx="0" cy="36" r="4.5"/><circle cx="48" cy="36" r="4.5"/>
        <circle cx="0" cy="48" r="4.5"/><circle cx="48" cy="48" r="4.5"/>
      </g>
    </g>

    <!-- "GEN" (Light Weight: r=2.5, Locked Accent Blue) -->
